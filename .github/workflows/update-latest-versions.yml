name: Update latest plugin versions

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-latest-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Fetch latest versions from PyPI
        run: python scripts/update_latest_versions.py
      - name: Commit changed versions
        run: |
          if git diff --quiet -- plugins.json; then
            echo "All plugin versions are current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          git commit -m "Update latest plugin versions"
          git push
